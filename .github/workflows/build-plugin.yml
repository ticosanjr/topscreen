name: Build plugin

# Builds the plugin against libobs and packs release archives.
# Run it in Actions > Build plugin > Run workflow.
#
# Requirements per runner:
#   linux:   a libobs dev environment (see docs/BUILD.md) or it fails loudly.
#   windows: Visual Studio 2022 + an OBS dev build (CMAKE_PREFIX_PATH).
# Artifacts: dist/topscreen-*-linux.tar.gz and/or dist/topscreen-*-windows.zip.

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential qt6-base-dev libx11-dev pkg-config zip

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

      - name: Pack release archive
        run: scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: topscreen-linux
          path: dist/topscreen-*-linux.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Pack release archive
        shell: pwsh
        run: |
          # package.sh needs bash; the zip layout is fixed, so pack here
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(TopScreen VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist, pkg\topscreen\bin\64bit | Out-Null
          Copy-Item build\Release\topscreen.dll pkg\topscreen\bin\64bit\
          Copy-Item -Recurse data\* pkg\topscreen\data\
          Compress-Archive -Path pkg\topscreen -DestinationPath "dist\topscreen-$ver-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: topscreen-windows
          path: dist/topscreen-*-windows.zip
