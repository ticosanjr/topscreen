name: Build plugin

# Manual workflow (best-effort) to build the plugin against libobs.
# Run it in Actions > Build plugin > Run workflow.
#
# The plugin build depends on the environment's libobs/obs-frontend-api/Qt6. Adjust
# CMAKE_PREFIX_PATH according to the installation (see docs/BUILD.md). The core
# tests job (tests.yml) runs automatically on push/PR.

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential qt6-base-dev libx11-dev pkg-config

      - name: Configure (find libobs)
        run: |
          if pkg-config --exists libobs; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          else
            echo "::warning::libobs not found. Set CMAKE_PREFIX_PATH to an OBS installation."
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTOPSCREEN_BUILD_TESTS=ON || true
          fi

      - name: Build
        run: cmake --build build -j || true

      - name: Tests (if it built)
        run: ctest --test-dir build --output-on-failure || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release
