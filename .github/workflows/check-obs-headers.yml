name: Check OBS headers

# Compiles the plugin against the REAL OBS headers (without libobs installed),
# catching API errors that the core tests do not catch.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Compile against OBS headers
        run: |
          chmod +x tools/check-obs-headers.sh
          TOPSCREEN_CHECK_DIR="$RUNNER_TEMP/obscheck" ./tools/check-obs-headers.sh

      - name: Integration tests (fake libobs)
        run: |
          chmod +x tests/run-integration.sh
          TOPSCREEN_CHECK_DIR="$RUNNER_TEMP/obscheck" ./tests/run-integration.sh

      - name: Integration tests (ASan + UBSan)
        env:
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          ASAN_OPTIONS: "detect_leaks=0"
          UBSAN_OPTIONS: "print_stacktrace=1"
        run: |
          TOPSCREEN_CHECK_DIR="$RUNNER_TEMP/obscheck" ./tests/run-integration.sh
