name: Release

# Builds ready-to-use packages when a version tag (v*) is pushed. The archives
# are uploaded as workflow artifacts; they are not committed because only the
# newest three versions are kept (GitHub Releases is the canonical download).
# Publish a GitHub Release manually with `gh release create` (docs/BUILD.md).
# Also runnable by hand (Actions > Release > Run workflow) for a test build.
#
#   topscreen-<version>-linux.tar.gz   -> extract into ~/.config/obs-studio/plugins/
#   topscreen-<version>-windows.zip    -> extract, then double-click install.bat
#
# There is no prebuilt libobs dev package for Windows, so that job uses the
# official OBS sources (headers, same version as the runtime) and generates the
# libobs import library from the shipped libobs.dll (dumpbin + lib).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep headers and runtime on the SAME version (see buildspec.json).
  OBS_VERSION: '31.1.1'
  # Qt6 + third-party deps for the Windows dock (Qt 6.8.3; Qt6 is forward
  # compatible within the major, so it also runs on newer OBS builds).
  DEPS_VERSION: '2025-07-11'

jobs:
  linux:
    name: Linux package
    # ubuntu-24.04 ships libobs-dev 30.0.2 + obs-frontend-api (dock) + Qt6.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (OBS dev from the distro)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libobs-dev qt6-base-dev libx11-dev pkg-config zip

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Core tests
        run: ctest --test-dir build --output-on-failure

      - name: Pack
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux
          path: releases/topscreen-*-linux.tar.gz
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the OBS sources and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:OBS_VERSION
          New-Item -ItemType Directory -Force .obs | Out-Null
          curl.exe -sSL -o obs-src.zip "https://github.com/obsproject/obs-studio/archive/refs/tags/$v.zip"
          tar -xf obs-src.zip -C .obs
          curl.exe -sSL -o obs-runtime.zip "https://github.com/obsproject/obs-studio/releases/download/$v/OBS-Studio-$v-Windows-x64.zip"
          Expand-Archive -Path obs-runtime.zip -DestinationPath obs-runtime -Force
          # Qt6 for the dock (same package the official plugin template uses).
          New-Item -ItemType Directory -Force .deps | Out-Null
          curl.exe -sSL -o qt6.zip "https://github.com/obsproject/obs-deps/releases/download/$env:DEPS_VERSION/windows-deps-qt6-$env:DEPS_VERSION-x64.zip"
          tar -xf qt6.zip -C .deps
          if (-not (Test-Path .deps/lib/cmake/Qt6/Qt6Config.cmake)) { throw 'Qt6 not found in obs-deps' }
          $src = (Get-ChildItem .obs -Directory | Select-Object -First 1).FullName
          # On Windows, libobs is shipped as bin\64bit\obs.dll.
          $dll = (Get-ChildItem obs-runtime -Recurse -File -Filter obs.dll | Select-Object -First 1).FullName
          if (-not $dll) { throw 'obs.dll (libobs) not found in the OBS runtime zip' }
          "OBS_SRC=$src"        | Add-Content $env:GITHUB_ENV
          "LIBOBS_DLL=$dll"     | Add-Content $env:GITHUB_ENV
          Write-Host "sources: $src"
          Write-Host "libobs : $dll"

      - name: Generate obsconfig.h (normally created by the OBS build)
        shell: pwsh
        run: |
          $cfg = @(
            '#pragma once',
            '#define OBS_DATA_PATH "data"',
            '#define OBS_PLUGIN_PATH "obs-plugins/64bit"',
            '#define OBS_PLUGIN_DESTINATION "obs-plugins/64bit"',
            '#define OBS_RELEASE_CANDIDATE 0',
            '#define OBS_BETA 0'
          ) -join "`r`n"
          Set-Content -Path "$env:OBS_SRC\libobs\obsconfig.h" -Value $cfg -Encoding ASCII
          Get-Content "$env:OBS_SRC\libobs\obsconfig.h"

      - name: Generate the libobs import library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Get-ChildItem "$tools\bin\Hostx64\x64" -Filter dumpbin.exe | Select-Object -First 1
          $libexe = Get-ChildItem "$tools\bin\Hostx64\x64" -Filter lib.exe | Select-Object -First 1
          if (-not $dumpbin -or -not $libexe) { throw 'MSVC tools (dumpbin/lib) not found' }
          New-Item -ItemType Directory -Force .importlib | Out-Null
          $names = & $dumpbin.FullName /nologo /exports $env:LIBOBS_DLL |
                   Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)' |
                   ForEach-Object { $_.Matches[0].Groups[1].Value } |
                   Sort-Object -Unique
          Write-Host "exported symbols: $($names.Count)"
          if ($names.Count -lt 100) { throw 'unexpected libobs export list' }
          $def = ".importlib\obs.def"
          Set-Content -Path $def -Value "LIBRARY obs" -Encoding ASCII
          Add-Content -Path $def -Value "EXPORTS" -Encoding ASCII
          Add-Content -Path $def -Value $names -Encoding ASCII
          & $libexe.FullName /nologo /def:$def /out:.importlib\obs.lib /machine:x64
          if (-not (Test-Path .importlib\obs.lib)) { throw 'failed to build obs.lib' }
          Write-Host 'import library: .importlib\obs.lib'

          # obs-frontend-api (C API used by the dock): same trick.
          $fapi = (Get-ChildItem obs-runtime -Recurse -File -Filter obs-frontend-api.dll | Select-Object -First 1).FullName
          if (-not $fapi) { throw 'obs-frontend-api.dll not found in the OBS runtime zip' }
          $def2 = ".importlib\obs-frontend-api.def"
          Set-Content -Path $def2 -Value "LIBRARY obs-frontend-api" -Encoding ASCII
          Add-Content -Path $def2 -Value "EXPORTS" -Encoding ASCII
          $names2 = & $dumpbin.FullName /nologo /exports $fapi |
                    Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)' |
                    ForEach-Object { $_.Matches[0].Groups[1].Value } |
                    Sort-Object -Unique
          Write-Host "frontend-api exports: $($names2.Count)"
          if ($names2.Count -lt 5) { throw 'unexpected obs-frontend-api export list' }
          Add-Content -Path $def2 -Value $names2 -Encoding ASCII
          & $libexe.FullName /nologo /def:$def2 /out:.importlib\obs-frontend-api.lib /machine:x64
          if (-not (Test-Path .importlib\obs-frontend-api.lib)) { throw 'failed to build obs-frontend-api.lib' }

          # Minimal CMake package so find_package(obs-frontend-api) resolves.
          $pkgDir = "$PWD/.deps/lib/cmake/obs-frontend-api"
          New-Item -ItemType Directory -Force $pkgDir | Out-Null
          # CMake strings treat backslash as an escape (D:\a\... -> 'invalid
          # character escape'), so paths are written with forward slashes.
          $libPath = "$PWD/.importlib/obs-frontend-api.lib".Replace('\', '/')
          $incPath = "$env:OBS_SRC/frontend/api".Replace('\', '/')
          $cfg = @(
            'add_library(OBS::obs-frontend-api UNKNOWN IMPORTED)',
            'set_target_properties(OBS::obs-frontend-api PROPERTIES',
            "  IMPORTED_LOCATION `"$libPath`"",
            "  INTERFACE_INCLUDE_DIRECTORIES `"$incPath`")"
          ) -join "`r`n"
          Set-Content -Path "$pkgDir/obs-frontend-apiConfig.cmake" -Value $cfg -Encoding ASCII
          Get-Content "$pkgDir/obs-frontend-apiConfig.cmake"
          Write-Host 'frontend-api package written'
      - name: Configure and build the plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The Qt dock needs obs-frontend-api + a matching Qt6, so the release
          # package ships the filter (Properties + hotkeys + presets + profiles).
          # No -G: use whatever Visual Studio the runner has installed.
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$PWD/.deps" `
            -DLIBOBS_INCLUDE_DIR="$env:OBS_SRC/libobs" `
            -DLIBOBS_LIBRARY="$PWD/.importlib/obs.lib" `
            -DENABLE_QT=ON -DENABLE_FRONTEND_API=ON -DTOPSCREEN_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          # Prove the dock is really linked in: the DLL must import Qt6.
          $dll = Get-Item build\Release\topscreen.dll
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll.FullName))
          if ($ascii -notmatch 'Qt6Widgets') { throw 'the Qt dock was not linked (Qt6Widgets missing)' }
          if ($ascii -notmatch 'obs-frontend-api') { throw 'obs-frontend-api missing from the plugin' }
          Write-Host 'dock linked: Qt6Widgets + obs-frontend-api present'

      - name: Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(TopScreen VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force releases, pkg\topscreen\bin\64bit, pkg\topscreen\data | Out-Null
          Copy-Item build\Release\topscreen.dll pkg\topscreen\bin\64bit\
          Copy-Item -Recurse data\* pkg\topscreen\data\
          # Launchers INSIDE the plugin folder, so nothing has to be moved.
          Copy-Item scripts\install-windows.bat pkg\topscreen\install.bat
          Copy-Item scripts\uninstall-windows.bat pkg\topscreen\uninstall.bat
          Compress-Archive -Path pkg\topscreen -DestinationPath "releases\topscreen-$ver-windows.zip" -Force
          Get-ChildItem releases

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: releases/topscreen-*-windows.zip
          if-no-files-found: error
