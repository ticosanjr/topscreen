name: Tests

# Core tests on Linux and Windows.
#
# Both jobs call the repository's own entry points (tests/run.sh and
# tests/run.ps1) instead of duplicating the compile line, so the CI can
# never drift from what a developer runs locally.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Core tests (Linux)
        if: runner.os == 'Linux'
        run: ./tests/run.sh

      - name: Core tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run.ps1
